[project]
name = "finops-sentinel"
version = "0.1.0"
description = "Cloud-native real-time cost anomaly detection microservice."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
finops-sentinel = "finops_sentinel:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "mypy>=1.14.0",
    "pip-audit>=2.7.3",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "radon>=6.0.1",
    "ruff>=0.9.0",
    "xenon>=0.9.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:pkg_resources",
    # Ignore Starlette's internal deprecation warning for httpx in TestClient,
    # as the project lockfile and architecture standardize on httpx (>=0.28.1)
    # while FastAPI's TestClient delegates directly to starlette.testclient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
